<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ed" />
    <meta name="description" content="奖学金申报自我介绍：学业基础、学习系统、MentalFlow 项目与持续学习研究。" />
    <title>奖学金自我介绍｜学习 · 构建 · 研究</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="presentation" id="presentation" aria-label="奖学金申报自我介绍录屏舞台">
      <nav class="chapter-rail" aria-label="叙事章节">
        <p class="rail-heading">CHAPTERS</p>
        <button class="chapter-button is-active" data-chapter="LEARNING" aria-current="step"><span>01</span><b>LEARNING</b></button>
        <button class="chapter-button" data-chapter="BUILDING"><span>02</span><b>BUILDING</b></button>
        <button class="chapter-button" data-chapter="RESEARCHING"><span>03</span><b>RESEARCHING</b></button>

      <section class="stage-shell" aria-live="polite">
        <div class="stage-topline">
          <span class="stage-series">学业优秀奖学金申报</span>
          <div class="scene-progress"><span id="scene-index">01</span><i>/</i><span id="scene-total">21</span><div class="progress-track"><b id="scene-progress-bar"></b></div></div>
        </div>
        <div class="scene-container" id="scene-container"></div>

          <span class="keyboard-hint">← 上一画面 <i>·</i> 下一画面 → / Space <i>·</i> H 隐藏底部控件</span>
          <div class="control-buttons">
            <button class="scene-control" id="previous-scene" aria-label="上一画面">←</button>
            <button class="scene-control next-control" id="next-scene" aria-label="下一画面">→</button>
          </div>
        </div>
      </section>
      <div class="stage-grain" aria-hidden="true"></div>
    </main>
